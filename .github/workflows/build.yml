# Build KickCrafter on the three platforms, run the JUCE-free engine tests on each (the only
# proof that every binary makes the same sound), then the checks that need no host and no display
# harness: the Steinberg VST3 validator (built from the pinned SDK, cached), pluginval, and auval
# for the Audio Unit on macOS. The gates that need REAPER, the displays or the sanitizers
# (`./run check`, `./run validate`, `./run memory`) run on the development machine only
# (docs/development.md, "Continuous integration and releases"). The Windows job also publishes
# the symbols (.pdb) so a crash dump from a tester can be read with a real stack.
#
# Nothing runs on GitHub outside a release (the owner's decision, 2026-09-20: no Actions minutes
# spent on ordinary pushes or pull requests). This workflow is therefore only called by
# release.yml, on the push of a version tag or on its manual rehearsal, and can be run by hand
# for a one-off check of a branch. Each job goes through `./run` only: juce, build, test-engine,
# dist (the same commands a developer types), then uploads the archive and the logs (with their
# .exit sidecars) as a workflow artifact kept 14 days. Nothing here signs or releases.
name: Build

on:
  workflow_call:
  workflow_dispatch:
    inputs:
      crash_dump:
        description: "Diagnostic Windows build: the module writes a crash minidump to %TEMP% (CMake KCF_CRASH_DUMP; archive named -crashdump; never a release)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  KCF_JOBS: 4   # the runners' core count (docs/development.md, "Environment variables")

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false   # one platform's failure must not hide the evidence of the other two
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
          - os: macos-15
            platform: macos-universal
          - os: windows-latest
            platform: windows-x86_64
    defaults:
      run:
        shell: bash   # Git Bash on Windows, bash 3.2 on macOS: `run` and the tools stay compatible
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build pkg-config git \
            libfreetype-dev libfontconfig-dev libasound2-dev \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            xvfb unzip   # pluginval opens the editor: a display; the pluginval release is a zip

      # macOS: Xcode's Apple Clang, CMake and Ninja are on the runner image; nothing to install.

      - name: MSVC developer environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: JUCE (pinned commit)
        run: ./run juce

      # The diagnostic build (epics/cubase-crash, way 3): Windows only, on the manual input.
      - name: Diagnostic build options
        if: runner.os == 'Windows' && inputs.crash_dump == true
        run: |
          echo "KCF_CMAKE_OPTIONS=-DKCF_CRASH_DUMP=ON" >> "$GITHUB_ENV"
          echo "KCF_DIST_SUFFIX=-crashdump" >> "$GITHUB_ENV"

      - name: Build
        run: ./run build

      - name: Engine tests
        run: ./run test-engine

      # The mechanism proven on the runner: with KCF_CRASH_TEST set, the diagnostic module raises
      # an access violation at its first instantiation; the validator process must die and a dump
      # must appear in %TEMP%. The dump is removed so the ordinary checks below start clean.
      - name: Crash dump self-test (diagnostic build)
        if: runner.os == 'Windows' && inputs.crash_dump == true
        run: |
          bundle="build/KickCrafter_artefacts/Release/VST3/KickCrafter.vst3"
          temp="$(cygpath -u "${TEMP:-${TMP:?}}")"
          rm -f "$temp"/KickCrafter-crash-*.dmp "$temp"/KickCrafter-crash-*.txt
          if KCF_CRASH_TEST=1 ./run validator "$bundle"; then echo "::error::the validator survived the deliberate crash"; exit 1; fi
          ls -la "$temp"/KickCrafter-crash-*.dmp "$temp"/KickCrafter-crash-*.txt
          cat "$temp"/KickCrafter-crash-*.txt
          rm -f "$temp"/KickCrafter-crash-*.dmp "$temp"/KickCrafter-crash-*.txt

      # Host-independent checks (epics/windows-validation). Each is its own step so the job
      # summary names the one that failed; every log lands under artifacts/logs/ and is uploaded
      # below even on failure. A failing check fails the job, hence the release.
      - name: Steinberg validator, cached build from the pinned SDK
        uses: actions/cache@v4
        with:
          path: external/validator
          key: ${{ runner.os }}-vst3-validator-v3.8.1_build_84

      - name: Steinberg validator (build if not cached)
        run: ./run fetch-validator

      - name: Steinberg validator on the bundle
        run: |
          bundle="build/KickCrafter_artefacts/Release/VST3/KickCrafter.vst3"
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a ./run validator "$bundle"; else ./run validator "$bundle"; fi

      - name: pluginval (pinned release)
        run: ./run fetch-pluginval

      - name: pluginval on the bundle, strictness 5
        run: |
          bundle="build/KickCrafter_artefacts/Release/VST3/KickCrafter.vst3"
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a ./run pluginval 5 "$bundle"; else ./run pluginval 5 "$bundle"; fi

      # Steinberg's editorhost: the SDK's own editor host, the closest public relative of
      # Cubase's window code (a tester's Cubase 11 crashed at the opening of the editor). Built
      # from the same SDK checkout, cached; macOS and Windows (on Linux it needs gtkmm). Alive
      # for 20 s with the editor open is the pass; the runner's screen is at 100 %, so this
      # exercises the attach and size negotiation, not the DPI scale factor.
      - name: editorhost, cached build from the pinned SDK
        if: runner.os != 'Linux'
        uses: actions/cache@v4
        with:
          path: external/editorhost
          key: ${{ runner.os }}-vst3-editorhost-v3.8.1_build_84

      - name: editorhost (build if not cached)
        if: runner.os != 'Linux'
        run: ./run fetch-editorhost

      - name: editorhost opens the editor and stays alive 20 s
        if: runner.os != 'Linux'
        run: ./run editorhost 20 "build/KickCrafter_artefacts/Release/VST3/KickCrafter.vst3"

      # auval needs the component registered: the runner's own plug-in folder, on a throwaway
      # machine. The only place a script installs the plug-in anywhere (CLAUDE.md).
      - name: auval on the Audio Unit
        if: runner.os == 'macOS'
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "build/KickCrafter_artefacts/Release/AU/KickCrafter.component" ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          tools/run-logged.sh auval auval -v aumu Kcfb Arnv

      - name: Architectures of the macOS bundles
        if: runner.os == 'macOS'
        run: |
          for bundle in "build/KickCrafter_artefacts/Release/VST3/KickCrafter.vst3" \
                        "build/KickCrafter_artefacts/Release/AU/KickCrafter.component"; do
            printf '%s: ' "$bundle"
            lipo -archs "$bundle/Contents/MacOS/KickCrafter"
          done

      - name: Archive
        run: ./run dist

      - name: Upload the archive
        uses: actions/upload-artifact@v7
        with:
          name: kickcrafter-${{ matrix.platform }}
          path: artifacts/dist/
          retention-days: 14
          if-no-files-found: error

      - name: Upload the Windows symbols
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v7
        with:
          name: kickcrafter-${{ matrix.platform }}-symbols
          path: build/symbols/
          retention-days: 90
          if-no-files-found: error

      # The logs (with their .exit sidecars) are kept even when a step failed: a failed run's
      # evidence is what one needs to read, and run-logged.sh prints only the log's path to the
      # console. A run that fails before the first logged step has nothing to upload, hence warn.
      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kickcrafter-${{ matrix.platform }}-logs
          path: artifacts/logs/
          retention-days: 14
          if-no-files-found: warn
